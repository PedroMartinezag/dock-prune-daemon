name: Release Multi-Arch Binaries & SLSA Provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Build, Attest & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Enforce Zero-External-Dependency Contract
        run: make verify-zero-dep

      - name: Run race-enabled test suite
        run: go test -race -count=1 ./...

      - name: Build static multi-arch archives & SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW_TAG="${GITHUB_REF_NAME:-0.1.0-dev}"
          VERSION="${RAW_TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          MODULE="github.com/PedroMartinezag/dock-prune-daemon"
          LDFLAGS="-s -w -X ${MODULE}/internal/buildinfo.Version=${VERSION} -X ${MODULE}/internal/buildinfo.Commit=${COMMIT} -X ${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE_DIR="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "${STAGE_DIR}"
            BIN_NAME="dock-prune-daemon"
            if [ "${GOOS}" = "windows" ]; then BIN_NAME="dock-prune-daemon.exe"; fi
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags "${LDFLAGS}" -o "${STAGE_DIR}/${BIN_NAME}" ./cmd/dock-prune-daemon
            for doc in LICENSE README.md; do
              if [ -f "${doc}" ]; then cp "${doc}" "${STAGE_DIR}/"; fi
            done
            if [ "${GOOS}" = "windows" ]; then
              (cd "${STAGE_DIR}" && zip -q "../dock-prune-daemon_${GOOS}_${GOARCH}.zip" *)
            else
              tar -C "${STAGE_DIR}" -czf "dist/dock-prune-daemon_${GOOS}_${GOARCH}.tar.gz" .
            fi
            rm -rf "${STAGE_DIR}"
          done

          (cd dist && sha256sum dock-prune-daemon_* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest SLSA v1.0 Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/dock-prune-daemon_*
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dock-prune-daemon_*
            dist/SHA256SUMS
